server:
  port: 8002

spring:
  application:
    name: short-link-admin
  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:classpath:shardingsphere-config-${database.env:dev}.yaml
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        ip: 127.0.0.1
          # 延长注册超时时间，默认3000ms容易超时
        metadata:
            preserved.register.timeout: 5000
    sentinel:
      transport:
        port: 9000  #项目与sentinel控制台交互的端口
        dashboard: 127.0.0.1:8090 #sentinel控制台的ip与端口
        # ✅强制sentinel transport服务绑定127.0.0.1，不要绑定错误网卡
        client-ip: 127.0.0.1
      # ✅【重点】开启饥饿加载，启动就连接dashboard，不用等访问接口
      eager: true



short-link:
  group:
    max-num: 20
  flow-limit:
    enable: true
    time-window: 1
    max-access-count: 20
