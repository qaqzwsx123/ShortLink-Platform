server:
  port: 8001

spring:
  application:
    name: short-link-project
  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:classpath:shardingsphere-config-${database.env:dev}.yaml
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  mvc:
    view:
      prefix: /templates/
      suffix: .html
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        ip: 127.0.0.1
        metadata:
          preserved.register.timeout: 5000
    sentinel:
      transport:
        port: 8719 #每个微服务的poet端口必须不一样
        dashboard: 127.0.0.1:8090
        client-ip: 127.0.0.1  # ✅强制sentinel transport服务绑定127.0.0.1，不要绑定错误网卡
      eager: true

short-link:
  domain:
    default: nurl.ink:8001
  stats:
    locale:
      amap-key: CHANGE_ME
  goto-domain:
    white-list:
      enable: true
      names: '拿个offer,知乎,掘金,博客园'
      details:
        - nageoffer.com
        - zhihu.com
        - juejin.cn
        - cnblogs.com

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml
